x-datasets-note: >-
  Each dataset has a specification sheet. Formats, update frequency and licensing are not stated on
  the page. Platformable will also customize a dataset or design one to a client's own data governance
  model. These five are the most direct overlap with the API Evangelist catalog — Government APIs and
  API Industry in particular are cohorts apis.io already scores, and Open Health/Privacy are cohorts it
  does not. Worth a explicit comparison pass before either side publishes overlapping numbers.

