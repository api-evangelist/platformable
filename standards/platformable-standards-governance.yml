open_code:
  x-note: >-
    44 public repositories in github.com/platformable as of 2026-07-31. Only two declare a license
    (0BSD). Most carry no description. Listed below are the ones with reference value to API
    Evangelist; the rest are website, CMS and client-project repos.
  repositories:
    - name: data-governance-toolkit
      url: https://github.com/platformable/data-governance-toolkit
      why: The toolkit behind the data governance framework and the governance systems app.
    - name: api-harmonizer
      url: https://github.com/platformable/api-harmonizer
      description: >-
        "A simple test app to compare multiple, different OAS documents for similarities and
        differences in what fields are filled in, and what data models are used."
      why: >-
        Direct overlap with the API Commons tooling and with the refined OpenAPI corpus — this is
        cross-spec comparison, which is exactly the shape of the conformance question. Highest-value
        repo in the org for us.
    - name: api-harmonizer-spread
      url: https://github.com/platformable/api-harmonizer-spread
      why: Spreadsheet companion to the harmonizer.
    - name: apiplaybook
      url: https://github.com/platformable/apiplaybook
      why: Likely the artifact behind the open digital ecosystem playbook Mark named as his next big piece.
    - name: ecosystem-thinking
      url: https://github.com/platformable/ecosystem-thinking
      why: The ecosystem model as code.
    - name: apidayslandscape
      url: https://github.com/platformable/apidayslandscape
      why: >-
        The APIdays landscape. Relevant to both the APIdays partnership and the API Evangelist
        landscape/market reports.
    - name: apidaysserver
      url: https://github.com/platformable/apidaysserver
      why: Backend for the APIdays landscape.
    - name: api-security-landscape-frontend
      url: https://github.com/platformable/api-security-landscape-frontend
      why: API security landscape — overlaps the security artifacts and the cybersecurity market report.
    - name: apisecuritylandscapeserver
      url: https://github.com/platformable/apisecuritylandscapeserver
      why: Backend for the security landscape.
    - name: api-privacy-landscape-frontend
      url: https://github.com/platformable/api-privacy-landscape-frontend
      why: API privacy landscape — a cohort apis.io does not currently cut.
    - name: api-privacy-landscape-server
      url: https://github.com/platformable/api-privacy-landscape-server
      why: Backend for the privacy landscape.
    - name: generic-landscape
      url: https://github.com/platformable/generic-landscape
      why: The reusable landscape engine underneath the named landscapes.
    - name: obofvaluetool
      url: https://github.com/platformable/obofvaluetool
      why: Open banking / open finance value tool — the value model made operational.
    - name: platformableobvtool
      url: https://github.com/platformable/platformableobvtool
      description: Platformable Open Banking Value Tool
      why: Earlier open banking value tool.
    - name: openbankingvalue
      url: https://github.com/platformable/openbankingvalue
      why: Open banking value data/model.
    - name: charts
      url: https://github.com/platformable/charts
      description: Platformable Trends Report Charts
      why: The chart layer behind the trends reports.
    - name: pricingtool
      url: https://github.com/platformable/pricingtool
      why: Pricing analysis tool — overlaps the plans/pricing artifacts in the catalog.

overlap_with_api_evangelist:
  complementary:
    - >-
      DEMAND vs SUPPLY. Platformable measures ecosystem value and policy maturity; API Evangelist
      measures what a provider actually ships. The two do not compete and read well together.
    - >-
      Country and policy coverage. Mark has country-level open banking and digital health policy data
      that the catalog does not carry; Kin has per-provider artifacts Mark does not.
    - >-
      Sector reach. Traceability, agri-food and digital health policy are Platformable's; the API
      catalog, Kin Score and standards profiling are Kin's.
  watch_for_collision:
    - >-
      API Industry Trends Report / API Industry dataset (58 data points) vs the API Evangelist market
      and landscape reports. Closest point of overlap — worth an explicit diff before either publishes.
    - >-
      Government APIs dataset (200 data points, coming soon) vs the CKAN/DKAN inventory and EU/state
      government coverage already in the catalog.
    - >-
      API security landscape vs the security artifacts and the cybersecurity market report.
