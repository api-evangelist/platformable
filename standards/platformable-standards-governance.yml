description: >-
  Standards, governance frameworks, models, dashboards, datasets and open code published by
  Platformable that API Evangelist can reference, cite and link to. Compiled 2026-07-31 by crawling
  platformable.com (sitemap + product pages + framework posts) and the github.com/platformable
  organization, as the reference half of the partnership logged in engagements/mark-boyd.md.
  Every entry below was observed on a live page or in the GitHub API response on that date.
x-evidence:
  method: crawl
  crawled: '2026-07-31'
  sources:
    - https://platformable.com/sitemap.xml
    - https://platformable.com/understand
    - https://platformable.com/products/api-governance
    - https://platformable.com/products/data-governance
    - https://platformable.com/products/datasets
    - https://platformable.com/products/open-banking
    - https://platformable.com/blog/measuring-the-value-of-open-ecosystems-1-our-model
    - https://platformable.com/blog/health-data-governance-framework
    - https://api.github.com/orgs/platformable/repos
  caveats:
    - >-
      The published sitemap lists 67 URLs and its newest lastmod is 2024-12; several products
      referenced from live pages (open-banking-accelerator, the digital health maturity dashboard,
      the traceability ecosystem site, academy.platformable.com) are NOT in it. Treat the sitemap as
      partial, not as the site index.
    - >-
      Licensing is unstated on almost everything. Only two GitHub repos declare a license (0BSD) and
      no framework page names a license. Do not describe any of this as "open" without asking Mark.
    - >-
      Most product pages read "join the waiting list" rather than offering a live purchase. Availability
      claims below reflect the page as observed, not a commitment.

frameworks:
  - name: Open Ecosystem Value Model
    kind: Model
    url: https://platformable.com/blog/measuring-the-value-of-open-ecosystems-1-our-model
    description: >-
      Platformable's core intellectual property and the frame Mark works from. Defines an open
      ecosystem as "a network of equitable participation opportunities that allow stakeholders to
      co-create, collaborate, complement, and/or compete" over shared APIs and infrastructure, and
      models it as three elements — stakeholders, their relationships, and the infrastructure.
      Assessment approach is taxonomy definition, data modeling, open-standards usage, value network
      analysis and ecosystem mapping.
    audience: Digital infrastructure policy leads, API providers, regulators, community advocates
    series: >-
      Article 1 of a series; later parts cover why APIs are central, stakeholder relationship types,
      why measuring value matters, and per-domain value flows (open banking, digital government,
      public health, circular economy).
    license: unstated
    reference_value: >-
      The demand-side counterpart to the Kin Score. Kin measures what a provider ships; this measures
      what an ecosystem produces. Cite when framing why a supply-side score is not the whole picture.

  - name: Platformable API Governance Model
    kind: Model
    url: https://platformable.com/products/api-governance
    description: >-
      Maps how APIs are built and managed inside an organization against industry best practice.
      Published as a diagram on the product page; the page carries no prose decomposition of the
      components. The page anchors its definition on Arnaud Lauret's — "API governance is enabling and
      facilitating people to work together on the right APIs."
    license: unstated
    reference_value: >-
      Directly adjacent to the API Evangelist governance body of work. Ask Mark for the component
      breakdown before citing specifics — the diagram is the only public statement of it.

  - name: Health Data Governance Framework
    kind: Framework
    url: https://platformable.com/blog/health-data-governance-framework
    description: >-
      A two-phase framework (six components in phase 1, five in phase 2) for using health data in a
      secure, safe, ethical and equitable manner. Reviewed by the WHO per the post. Positioned against
      the European Health Data Space (EHDS) as the regulatory driver.
    references:
      - European Health Data Space (EHDS)
      - WHO
    audience: Health professionals, data practitioners, policy-makers, researchers
    license: unstated
    reference_value: >-
      Pairs with the healthcare sector work and the regulations site. Note the FHIR gap — this
      framework is governance-of-data, not an interface standard.

  - name: Data Justice Principles
    kind: Framework
    url: https://platformable.com/blog/data-justice-in-health-data-governance
    description: >-
      Article 2 of the "Data Governance for Digital Health Ecosystems" series; positioned as sitting at
      the core of the health data governance framework.
    license: unstated

  - name: Agri-food data governance code of practice (CSA Group)
    kind: CodeOfPractice
    url: null
    status: in-progress
    description: >-
      Mark is the seed-document writer for a Canadian agri-food data governance code of practice for
      CSA Group (Canada's Standards Association) — he writes the shoulds and shalls, an industry
      committee debates it for roughly a year, then it evolves toward a standard. Not yet public.
      Source is the 2026-07-31 conversation, not the website.
    x-evidence: conversations/transcripts/2026-07-31-mark-boyd.md
    reference_value: >-
      The template for the standards-report -> standards-body -> Mark-builds-the-tool play. Watch for
      publication; it is the first end-to-end proof of the partnership pattern.

dashboards_and_reports:
  - name: OBOF Trends Report
    kind: Report
    url: https://platformable.com/products/open-banking
    cadence: quarterly
    description: >-
      Quarterly open banking / open finance market analysis — market dynamics, pricing, regulation,
      technology and product innovation, with country-level data, visualizations and spreadsheets.
      Subscription includes quarterly analyst calls. A free sample report (Q2 2024) was downloadable.
    coverage: >-
      Backed by a proprietary global database of bank APIs, described on the page as the best global
      coverage of banks' APIs.
    note: >-
      The page does not enumerate which standards it tracks (PSD2, Berlin Group, UK Open Banking, FDX,
      CDR); it references regulatory updates generically. Confirm with Mark before claiming coverage of
      a named standard.

  - name: Open Banking Accelerator
    kind: Dashboard
    url: https://platformable.com/products/open-banking-accelerator
    description: Ecosystem monitoring dashboard for open banking.

  - name: Global Digital Health Policy Maturity Dashboard
    kind: Dashboard
    url: https://platformable.com/products/Global-Digital-Health-Policy-Maturity-Dashboard
    description: Tracks digital health policy maturity globally.

  - name: API Industry Trends Report
    kind: Report
    url: https://platformable.com/contact-us
    description: Platformable's API industry trends report; the page routes to contact rather than a product page.

  - name: Traceability Ecosystem Mapping
    kind: Dashboard
    url: https://platformable.com/understand
    description: >-
      A dynamic ecosystem website for traceability, alongside agri-food data and digital ecosystem
      mapping. Traceability is Platformable's newest sector focus.
    repo: https://github.com/platformable/traceabilitywebsite

