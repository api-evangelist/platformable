specification: API Evangelist Partner Resource Index
specificationVersion: '0.1'
provider: Platformable
providerId: platformable
created: '2026-07-31'
modified: '2026-07-31'
tags:
  - API Governance
  - Data Governance
  - Ecosystems
  - Open Banking
  - Digital Health
